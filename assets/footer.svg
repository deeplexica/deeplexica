<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" role="img"><defs>
<linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#046CB9"/><stop offset=".54" stop-color="#4464DB"/><stop offset="1" stop-color="#9A34A5"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090C28"/><stop offset="1" stop-color="#19144D"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#297ED7" stop-opacity=".6"/><stop offset="1" stop-color="#297ED7" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="23"/></filter>
</defs><style>
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes dash{to{stroke-dashoffset:-80}}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
.breathe{animation:breathe 4s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.dash{animation:dash 6s linear infinite}.scan{animation:scan 8s linear infinite}
