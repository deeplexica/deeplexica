
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Deep Lexica animated intelligence network with AI engineering pipeline">
<defs><linearGradient id="brand" x2="1" y2="1"><stop offset="0" stop-color="#096FBC"/><stop offset=".54" stop-color="#406BDC"/><stop offset="1" stop-color="#9C3BA6"/></linearGradient><radialGradient id="halo"><stop stop-color="#2D7BCF" stop-opacity=".35"/><stop offset="1" stop-color="#19234D" stop-opacity="0"/></radialGradient><filter id="light"><feGaussianBlur stdDeviation="10"/></filter></defs><style>
@keyframes pulse {0%,100% {opacity:.35}50%{opacity:1}} 
@keyframes dash {to{stroke-dashoffset:-120}}
@keyframes bob {0%,100% {transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes appear {0%,20%{opacity:0}30%,90%{opacity:1}100%{opacity:0}}
@keyframes glow {0%,100%{fill:#2C7CBD}50%{fill:#B373E9}}
@keyframes spin {to{transform:rotate(360deg)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}.dash{animation:dash 7s linear infinite}.bob{animation:bob 5s ease-in-out infinite}.appear{animation:appear 9s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
